name: Mt Eden Sun Times

on:
  # Fired by cron-job.org at 17:00 Pacific/Auckland (that service handles DST).
  # GitHub's own `schedule:` trigger proved unreliable here, so timing is owned
  # externally; see README.md.
  repository_dispatch:
    types: [sunset-notify]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send sunset/sunrise notification
        env:
          NTFY_TOPIC: mt-eden-sunsets
        run: python scripts/sunset_notify.py
