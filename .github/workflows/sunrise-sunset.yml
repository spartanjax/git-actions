name: Mt Eden Sun Times

on:
  schedule:
    # 4:58pm Auckland every day. The `timezone` field makes GitHub handle
    # daylight saving automatically, and minute :58 avoids the top-of-hour
    # load spike where scheduled runs are most likely to be delayed or dropped.
    - cron: "58 16 * * *"
      timezone: "Pacific/Auckland"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send sunset/sunrise notification
        env:
          NTFY_TOPIC: mt-eden-sunsets
        run: python scripts/sunset_notify.py
